<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Profile - FitTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="card shadow border-0">

            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h3 class="fw-bold mb-0">

                        <i class="fa fa-user me-2"></i>
                        Admin Profile

                    </h3>

                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">

                        <i class="fa fa-arrow-left me-1"></i>
                        Dashboard

                    </a>

                </div>

                <hr>


                <!-- Flash Messages -->

                {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                {% for category, message in messages %}

                <div class="alert alert-{{ category }}">

                    {{ message }}

                </div>

                {% endfor %}

                {% endif %}

                {% endwith %}


                <div class="row align-items-center">

                    <!-- Avatar -->

                    <div class="col-md-4 text-center">

                        <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center fw-bold text-white"
                            style="
                            width:120px;
                            height:120px;
                            background:linear-gradient(135deg,#667eea,#764ba2);
                            font-size:45px;
                        ">

                            {{ admin['name'][0]|upper }}

                        </div>

                        <h4 class="fw-bold mt-3 mb-1">

                            {{ admin['name'] }}

                        </h4>

                        <p class="text-muted">

                            Gym Administrator

                        </p>

                    </div>


                    <!-- Profile Form -->

                    <div class="col-md-8">

                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Name
                                </label>

                                <input type="text" name="name" class="form-control" value="{{ admin['name'] }}"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Email
                                </label>

                                <input type="email" name="email" class="form-control" value="{{ admin['email'] }}"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Mobile
                                </label>

                                <input type="text" name="mobile" class="form-control" value="{{ admin['mobile'] }}"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Role
                                </label>

                                <input type="text" class="form-control" value="{{ admin['role']|title }}" readonly>

                            </div>


                            <button type="submit" class="btn btn-primary">

                                <i class="fa fa-save me-1"></i>

                                Save Profile

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
